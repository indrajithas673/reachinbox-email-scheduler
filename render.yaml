databases:
  - name: reachinbox-db
    databaseName: reachinbox
    user: reachinbox_user
    plan: free

services:
  - type: redis
    name: reachinbox-redis
    plan: free
    ipAllowList: [] # Allows internal connections only by default

  - type: web
    name: reachinbox-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: "https://reachinbox-backend.onrender.com/api/auth/google/callback"
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ETHEREAL_USER
        sync: false
      - key: ETHEREAL_PASSWORD
        sync: false
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: MIN_EMAIL_DELAY_MS
        value: "5000"
      - key: MAX_EMAILS_PER_HOUR
        value: "100"
